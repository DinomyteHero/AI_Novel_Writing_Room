agent_routing:
  canon_expert:
    backend: cloud
    model: grok420
    params:
      temperature: 0.2
  chapter_blueprint_synthesizer:
    backend: cloud
    model: gemini
    params:
      max_tokens: 8192
      temperature: 0.4
  chapter_gate_critic:
    backend: cloud
    model: haiku
    params:
      temperature: 0.3
  character_specialist:
    backend: cloud
    model: deepseek
    params:
      temperature: 0.3
  concept_workshop:
    backend: cloud
    model: gemini
    params:
      max_tokens: 8192
      temperature: 0.7
  final_gate:
    backend: cloud
    model: haiku
    params:
      temperature: 0.2
  gate_critic:
    backend: cloud
    model: haiku
    params:
      temperature: 0.3
  judge_evaluator:
    backend: cloud
    model: grok420
    params:
      temperature: 0.2
  lore_extractor:
    backend: cloud
    model: deepseek
    params:
      max_tokens: 8192
      temperature: 0.2
  manuscript_reviewer:
    backend: cloud
    model: kimi
    params:
      temperature: 0.3
  orchestrator:
    backend: cloud
    model: grok41fast
  outline_planner:
    backend: cloud
    model: gemini
    params:
      max_tokens: 32768
      temperature: 0.5
  plot_architect:
    backend: cloud
    model: grok420
    params:
      max_tokens: 8192
      temperature: 0.4
  prose_stylist:
    backend: cloud
    model: gpt54
    params:
      max_tokens: 8192
      temperature: 0.7
  quality_polish:
    backend: cloud
    model: haiku
    params:
      max_tokens: 8192
      temperature: 0.4
  seed_builder:
    backend: cloud
    model: gemini
    params:
      max_tokens: 16384
      temperature: 0.3
  stress_test:
    backend: cloud
    model: deepseek
    params:
      temperature: 0.5
  summarizer:
    backend: cloud
    model: deepseek
    params:
      temperature: 0.2
  voice_checker:
    backend: cloud
    model: mistral_small4
    params:
      temperature: 0.3
  worldbuilding_coherence_reviewer:
    backend: cloud
    model: grok420
    params:
      temperature: 0.3
deployment_mode: cloud
models:
  cloud:
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    default_params:
      claude:
        max_tokens: 8192
        temperature: 0.4
      deepseek:
        max_tokens: 4096
        temperature: 0.3
      gemini:
        max_tokens: 8192
        temperature: 0.6
      gemini_flash:
        max_tokens: 8192
        temperature: 0.5
      glm:
        max_tokens: 8192
        temperature: 0.4
      gpt54:
        max_tokens: 8192
        temperature: 0.7
      grok41fast:
        max_tokens: 8192
        temperature: 0.3
      grok420:
        max_tokens: 8192
        temperature: 0.3
      haiku:
        max_tokens: 4096
        temperature: 0.4
      kimi:
        max_tokens: 8192
        temperature: 0.4
      minimax:
        max_tokens: 4096
        temperature: 0.3
      mistral_small4:
        max_tokens: 4096
        temperature: 0.3
    models:
      claude: anthropic/claude-sonnet-4.6
      deepseek: deepseek/deepseek-v3.2
      gemini: google/gemini-3.1-pro-preview
      gemini_flash: google/gemini-3-flash-preview
      glm: z-ai/glm-5.1
      gpt54: openai/gpt-5.4
      grok41fast: x-ai/grok-4.1-fast
      grok420: x-ai/grok-4.20
      haiku: anthropic/claude-haiku-4.5
      kimi: moonshotai/kimi-k2
      minimax: minimax/minimax-m2.7
      mistral_small4: mistralai/mistral-small-2603
      qwen: qwen/qwen3.6-plus
    provider: openrouter
    timeout_seconds: 300
  local:
    base_url: http://localhost:8080/v1
    default_params: {}
    inference_backend: llama-server
    models: {}
    timeout_seconds: 300
pipeline:
  embeddings:
    model: nomic-ai/nomic-embed-text-v1.5
    use_mock: true
  max_http_retries: 2
  max_structural_retries: 3
  max_voice_retries: 2
  prompt_caching:
    anthropic_ttl: 1h
    enabled: true
worldbuilding:
  auto_extraction:
    auto_promote: false
    enabled: true
  db_path: output/_fallback/worldbuilding.db
  default_top_k: 5
  include_provisional_in_context: false
  reconciliation:
    interval_minutes: 60
    run_on_startup: true
  terminology:
    always_include: true
  vectors_dir: output/_fallback/worldbuilding_vectors
  walk_parents: true
