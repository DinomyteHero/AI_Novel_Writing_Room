models:
  cloud:
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    default_params:
      claude:
        max_tokens: 8192
        temperature: 0.4
      deepseek:
        max_tokens: 4096
        reasoning:
          effort: none
        temperature: 0.3
      deepseekpro:
        max_tokens: 8192
        reasoning:
          effort: none
        temperature: 0.3
      gemini:
        max_tokens: 8192
        temperature: 0.6
      gemini_flash:
        max_tokens: 8192
        temperature: 0.5
      glm:
        max_tokens: 8192
        temperature: 0.4
      gpt54:
        max_tokens: 12000
        temperature: 0.8
      gpt54_mini:
        max_tokens: 8192
        temperature: 0.5
      grok41fast:
        max_tokens: 8192
        temperature: 0.3
      grok420:
        max_tokens: 8192
        temperature: 0.3
      haiku:
        max_tokens: 4096
        temperature: 0.4
      kimi:
        max_tokens: 8192
        temperature: 0.4
      kimi26:
        max_tokens: 8192
        temperature: 0.4
      minimax:
        max_tokens: 4096
        temperature: 0.3
      mistral_small4:
        max_tokens: 4096
        temperature: 0.3
    models:
      claude: anthropic/claude-sonnet-4.6
      deepseek: deepseek/deepseek-v4-flash
      deepseekpro: deepseek/deepseek-v4-pro
      gemini: google/gemini-3.1-pro-preview
      gemini_flash: google/gemini-3-flash-preview
      glm: z-ai/glm-5.1
      gpt54: openai/gpt-5.4
      gpt54_mini: openai/gpt-5.4-mini
      grok41fast: x-ai/grok-4.1-fast
      grok420: x-ai/grok-4.20
      haiku: anthropic/claude-haiku-4.5
      kimi: moonshotai/kimi-k2.5
      kimi26: moonshotai/kimi-k2.6
      minimax: minimax/minimax-m2.7
      mistral_small4: mistralai/mistral-small-2603
      qwen: qwen/qwen3.6-plus
    provider: openrouter
    timeout_seconds: 300
  local:
    base_url: http://localhost:8080/v1
    default_params: {}
    inference_backend: llama-server
    models: {}
    timeout_seconds: 300
pipeline:
  embeddings:
    model: nomic-ai/nomic-embed-text-v1.5
    use_mock: true
  max_http_retries: 2
  max_structural_retries: 0
  max_voice_retries: 0
  prompt_caching:
    anthropic_ttl: 1h
    enabled: true
runtime:
  canon_expert:
    apply_local_fixes: false
    early_position: false
    local_fixes_whitelist: []
  chapter_packet:
    enabled: true
    fallback_on_error: true
  commercial_rewrite:
    enabled: false
    max_word_count_ratio: 1.35
    min_quality_score: 0.72
    min_word_count_ratio: 0.75
    trigger_failure_codes:
    - TELLING_NOT_SHOWING
    - PROSE_CLICHE_BURST
    - TERMINOLOGY_DRIFT
    - VOICE_DEFINITION_VIOLATION
    - OPENING_HOOK_MISMATCH
    trigger_flag_keywords:
    - show-don't-tell
    - telling
    - repeated n-gram
    - semantically similar
    - scene type imbalance
    - description
    - overused words
    - cliche
    - "clich\xC3\xA9"
  continuity_log:
    enabled: false
    min_confidence: 0.85
  corrective_rerun:
    enabled: false
    max_failure_codes: 3
    min_word_count_ratio: 0.5
    trigger_codes:
    - MISSING_TURNING_POINT
    - CLOSING_HOOK_VIOLATION
  firewall:
    enabled: false
    successor_classifier:
      adjacency_max_for_continue: 1
      enabled: false
      jaccard_threshold: 0.5
  lean_prose_only:
    enabled: true
  micro_repair:
    enabled: false
    max_changed_ratio: 0.12
    max_repairs: 2
    max_total_changed_chars: 500
  phase0_audit:
    enabled: false
  promise_ledger:
    enabled: false
  revision_debt:
    enabled: false
  sociogram:
    enabled: false
    suggest_mode: false
worldbuilding:
  auto_extraction:
    auto_promote: false
    enabled: true
  db_path: output/_fallback/worldbuilding.db
  default_top_k: 5
  include_provisional_in_context: false
  reconciliation:
    interval_minutes: 60
    run_on_startup: true
  terminology:
    always_include: true
  vectors_dir: output/_fallback/worldbuilding_vectors
  walk_parents: true
