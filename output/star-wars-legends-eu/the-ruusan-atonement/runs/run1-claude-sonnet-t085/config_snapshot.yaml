agent_routing:
  canon_expert:
    backend: cloud
    model: gemini_flash
    params:
      temperature: 0.2
  character_specialist:
    backend: cloud
    model: gemini_flash
    params:
      temperature: 0.4
  concept_workshop:
    backend: cloud
    model: gemini
    params:
      max_tokens: 8192
      temperature: 0.7
  craft_editor:
    backend: cloud
    model: haiku
    params:
      temperature: 0.4
  dialogue_polish_editor:
    backend: cloud
    model: haiku
    params:
      temperature: 0.4
  gate_critic:
    backend: cloud
    model: claude
    params:
      temperature: 0.3
  judge_evaluator:
    backend: cloud
    model: claude
    params:
      temperature: 0.2
  line_copy_editor:
    backend: cloud
    model: gemini_flash
    params:
      temperature: 0.3
  lore_extractor:
    backend: cloud
    model: gemini_flash
    params:
      temperature: 0.2
  manuscript_reviewer:
    backend: cloud
    model: claude
    params:
      temperature: 0.3
  orchestrator:
    backend: cloud
    model: gemini_flash
  outline_planner:
    backend: cloud
    model: gemini
    params:
      max_tokens: 32768
      temperature: 0.5
  plot_architect:
    backend: cloud
    model: gemini_flash
    params:
      temperature: 0.4
  prose_stylist:
    backend: cloud
    model: claude
    params:
      max_tokens: 8192
      temperature: 0.85
  scene_emotion_reviewer:
    backend: cloud
    model: haiku
    params:
      temperature: 0.5
  seed_builder:
    backend: cloud
    model: gemini
    params:
      max_tokens: 16384
      temperature: 0.3
  stress_test:
    backend: cloud
    model: gemini_flash
    params:
      temperature: 0.5
  structural_continuity_reviewer:
    backend: cloud
    model: gemini_flash
    params:
      temperature: 0.3
  summarizer:
    backend: cloud
    model: gemini_flash
    params:
      temperature: 0.2
  voice_checker:
    backend: cloud
    model: gemini_flash
    params:
      temperature: 0.3
  worldbuilding_coherence_reviewer:
    backend: cloud
    model: gemini_flash
    params:
      temperature: 0.3
deployment_mode: cloud
models:
  cloud:
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    default_params:
      claude:
        max_tokens: 8192
        temperature: 0.4
      deepseek:
        max_tokens: 4096
        temperature: 0.3
      gemini:
        max_tokens: 8192
        temperature: 0.6
      gemini_flash:
        max_tokens: 8192
        temperature: 0.5
      haiku:
        max_tokens: 4096
        temperature: 0.4
    models:
      claude: anthropic/claude-sonnet-4.6
      deepseek: deepseek/deepseek-v3.2
      gemini: google/gemini-3.1-pro-preview
      gemini_flash: google/gemini-3-flash-preview
      glm: z-ai/glm-5.1
      haiku: anthropic/claude-haiku-4.5
      kimi: moonshotai/kimi-k2
      qwen: qwen/qwen3.6-plus
    provider: openrouter
    timeout_seconds: 300
  local:
    base_url: http://localhost:8080/v1
    default_params: {}
    inference_backend: llama-server
    models: {}
    timeout_seconds: 300
pipeline:
  embeddings:
    model: nomic-ai/nomic-embed-text-v1.5
    use_mock: true
  max_http_retries: 2
  max_structural_retries: 3
  max_voice_retries: 2
worldbuilding:
  auto_extraction:
    auto_promote: false
    enabled: true
  db_path: data/worldbuilding.db
  default_top_k: 5
  include_provisional_in_context: false
  reconciliation:
    interval_minutes: 60
    run_on_startup: true
  terminology:
    always_include: true
  vectors_dir: data/worldbuilding_vectors
  walk_parents: true
