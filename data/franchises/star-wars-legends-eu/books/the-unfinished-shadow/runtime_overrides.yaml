# Runtime overrides for "The Unfinished Shadow".
#
# This book is the test bed for the upgraded pipeline rhythm + register
# tooling. The shipping books (Ruusan, Betrayal) keep these flags off per
# the shipping-book guards in tests/test_runtime_flags.py — this book opts
# in explicitly so the regenerated chapters exercise the new ProseStylist
# prompt, RhythmValidator telemetry, and RhythmEditor literal-edit pass.

runtime:
  # Lean prose path stays default (PlotArchitect -> ProseStylist -> LineWriter -> save).
  # The lean line-edit pass benefits directly from the new prompt without any
  # additional toggles.

  # Length calibration, measured on this book's climax scene (4 bench samples,
  # 2026-06-09): DeepSeek V4 Pro delivers ~43-58% of any asked word count, so
  # the rendered ask is inflated 1.8x to land delivered prose near the card
  # targets. Telemetry still measures drift against the un-inflated targets.
  lean_prose_only:
    length_calibration: 1.8

  # Rhythm validator: deterministic measurement of em-dash density, staccato
  # clusters, opener variance, dialogue density, and abstract-construction
  # tics on each scene. Emits revision_debt rows for human review.
  rhythm_validator:
    enabled: true

  # Rhythm editor: bounded literal-edit pass that fixes detected rhythm
  # issues. Safety caps in apply_rhythm_edits are enforced regardless of
  # what the LLM returns. Same safety model as micro_repair.
  rhythm_editor:
    enabled: true
    # Codes must match RhythmValidator's emitted RhythmIssue.code values
    # (src/quality/rhythm_validator.py), which are unprefixed `rhythm.*`.
    # The orchestrator matches these literally (orchestrator.py), so a
    # `prose.rhythm.*` prefix here silently disables the editor.
    trigger_codes:
      - rhythm.em_dash_overuse
      - rhythm.staccato_cluster
      - rhythm.opener_monotone
      - rhythm.abstract_tic
    max_trigger_codes: 5
    # Caps raised from the 8/1500 shipping defaults for this book: DeepSeek
    # V4 Pro drafts carry 13-20 em-dashes per 1k words (bench 2026-06-09),
    # and cutting toward the ~3/1k budget needs more, smaller literal edits
    # than the default budget allows. Ratio ceiling unchanged.
    max_edits: 20
    max_total_changed_chars: 3500
    max_changed_ratio: 0.15

  # Revision debt store: structured advisories from the rhythm validator and
  # other producers land in output/<franchise>/<book>/state/revision_debt.db
  # for human review.
  revision_debt:
    enabled: true

  # Chapter packet is shipping default (true) but pin explicitly so this book
  # always uses the post-D4a inspectable runtime contract.
  chapter_packet:
    enabled: true
    fallback_on_error: true

  # Promise ledger (Slice 3): seeded from this book's planning (12 promises,
  # PP_01..PP_12) via scripts/migrations/migrate_promise_ledger.py into the
  # series-scoped state at output/.../the-unfinished-cycle/state/. Packet
  # overlays surface the top-5 urgency-ranked promises per scene; scene-card
  # promises_progressed / promises_paid record deltas at save time.
  promise_ledger:
    enabled: true

  # Declared-state apply: scene-card end_state declarations write
  # characters.status at save time (declarations win over the Summarizer's
  # extracted diff); start_state declarations are verified against
  # accumulated state and drift lands as a continuity advisory.
  declared_state:
    enabled: true

  # Cross-chapter continuity validator: start_state / end_state / objects_at_*
  # declarations were backfilled onto the cards (2026-06-09, explicit-only:
  # deaths, captures, the Aevyn presumed-dead arc, fragment + holocron
  # custody). Validates clean at HEAD — 0 breaks, 29 silent pairs.
  continuity_validator:
    enabled: true
