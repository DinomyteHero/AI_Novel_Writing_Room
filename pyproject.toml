[project]
name = "ai-writers-room"
version = "0.1.0"
description = "Multi-agent long-form fiction generation pipeline"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Default-ish high-signal ruleset: pyflakes (F) + a subset of pycodestyle (E).
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Scripts, the server entry, and the CLI import after a runtime sys.path insert
# / load_dotenv() that must run first.
"scripts/*" = ["E402"]
"src/ui/server.py" = ["E402"]
"src/main.py" = ["E402"]
# Package __init__ files deliberately re-export symbols.
"**/__init__.py" = ["F401"]
# Tests import after pytest.importorskip and bind fixtures for side effects.
"tests/*" = ["F401", "F841", "E402"]
