[project]
name = "ai-writers-room"
version = "0.1.0"
description = "Plan and draft novels with an AI co-writer, using whole-book context"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/DinomyteHero/AI_Novel_Writing_Room"
Issues = "https://github.com/DinomyteHero/AI_Novel_Writing_Room/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Default-ish high-signal ruleset: pyflakes (F) + a subset of pycodestyle (E).
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The CLI imports after a runtime sys.path insert.
"scripts/*" = ["E402"]
# Package __init__ files deliberately re-export symbols.
"**/__init__.py" = ["F401"]
