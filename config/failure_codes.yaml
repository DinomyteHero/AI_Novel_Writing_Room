failure_codes:
  structural:
    CONTINUITY_CONTRADICTION: "Scene contradicts established story state"
    WEAK_TURNING_POINT: "Scene ends in roughly the same state it began"
    MISSING_TURNING_POINT: "No identifiable shift in scene dynamics"
    UNEARNED_RESOLUTION: "Conflict resolved without sufficient buildup or cost"
    STRUCTURAL_PHASE_VIOLATION: "Scene actions violate Brooks phase constraints"
    PROMISE_BROKEN: "Setup or foreshadow is contradicted without intentional subversion"
    MOTIVATION_GAP: "Character action lacks traceable motivation from state or arc"
    CANON_VIOLATION: "Scene contradicts established franchise lore"
    CHARACTER_ARC_STALL: "POV character has not progressed Weiland arc phase within expected structural window"
    HOOK_VIOLATION: "Unauthorized hook planted, or required hook advancement missed"
    SUBPLOT_DRIFT: "Active subplot ignored or resolved subplot reopened without justification"
    CLOSING_HOOK_VIOLATION: "Final Gate: polished prose does not honor the scene card's closing hook boundary"
    # Forward Relay v4: CHARACTER_PRESENCE_VIOLATION removed from both gates;
    # character presence is enforced solely by the PresenceChecker at save time.
    OPENING_HOOK_MISMATCH: "Final Gate: opening prose does not align with the scene card's opening hook"

  voice:
    OOC_DIALOGUE: "Character speaks in a way inconsistent with voice profile"
    OOC_ACTION: "Character acts inconsistently with established dimensions"
    TELLING_NOT_SHOWING: "Emotional state narrated rather than demonstrated"
    TERMINOLOGY_DRIFT: "Term from registry spelled differently or used inconsistently"
    VOICE_DEFINITION_VIOLATION: "Prose violates voice definition rules (anti-slop, anti-patterns)"

  polish:
    EXPOSITION_LEAK: "World-building info dumped outside natural scene flow"
    PACING_FLATLINE: "Insufficient sentence/event variety across scene"
    PROSE_CLICHE_BURST: "Multiple banned phrases or AI-tells detected"
    WORD_COUNT_VIOLATION: "Scene prose falls outside the target word count range"

# Post-Phase 1 pipeline redesign: these routing labels are legacy telemetry.
# GateCritic verdicts do not branch by themselves; only the optional
# runtime.corrective_rerun path can perform one narrow redraft. fail_polish no
# longer routes to a CraftEditor. Severe polish collapse is handled by the
# deterministic compression guard in orchestrator.py. The literal values below
# are retained for legacy consumers and should not be read as live routing.
routing:
  fail_structural: full_rewrite
  fail_voice: targeted_revision
  fail_polish: revert_to_gate_passed_draft
