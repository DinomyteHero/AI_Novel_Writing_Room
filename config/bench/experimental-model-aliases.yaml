# Bench-only model aliases that are not routed by config/settings.yaml.
# This file is a reference for new bench settings snapshots; ModelRouter does
# not include it automatically.

models:
  cloud:
    models:
      gemini_flash: google/gemini-3-flash-preview
      haiku: anthropic/claude-haiku-4.5
      glm: z-ai/glm-5.1
      qwen: qwen/qwen3.6-plus
      kimi: moonshotai/kimi-k2.5
      kimi26: moonshotai/kimi-k2.6
      minimax: minimax/minimax-m2.7
    default_params:
      gemini_flash:
        temperature: 0.5
        max_tokens: 8192
      haiku:
        temperature: 0.4
        max_tokens: 4096
      glm:
        temperature: 0.4
        max_tokens: 8192
      qwen:
        temperature: 0.4
        max_tokens: 8192
      kimi:
        temperature: 0.4
        max_tokens: 8192
      kimi26:
        temperature: 0.4
        max_tokens: 8192
      minimax:
        temperature: 0.3
        max_tokens: 4096
