deployment_mode: cloud  # local | cloud | hybrid

models:
  local:
    inference_backend: llama-server
    base_url: http://localhost:8080/v1
    timeout_seconds: 300
    models: {}
    default_params: {}

  cloud:
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 300
    models:
      gemini: google/gemini-3.1-pro-preview
      gemini_flash: google/gemini-3-flash-preview
      deepseek: deepseek/deepseek-v3.2
      claude: anthropic/claude-sonnet-4.6
      haiku: anthropic/claude-haiku-4.5
      glm: z-ai/glm-5.1
      qwen: qwen/qwen3.6-plus
      kimi: moonshotai/kimi-k2
      grok420: x-ai/grok-4.20
      grok41fast: x-ai/grok-4.1-fast
      mistral_small4: mistralai/mistral-small-2603
      minimax: minimax/minimax-m2.7
      gpt54: openai/gpt-5.4
    default_params:
      gemini:
        temperature: 0.6
        max_tokens: 8192
      gemini_flash:
        temperature: 0.5
        max_tokens: 8192
      deepseek:
        temperature: 0.3
        max_tokens: 4096
      claude:
        temperature: 0.4
        max_tokens: 8192
      haiku:
        temperature: 0.4
        max_tokens: 4096
      glm:
        temperature: 0.4
        max_tokens: 8192
      grok420:
        temperature: 0.3
        max_tokens: 8192
      grok41fast:
        temperature: 0.3
        max_tokens: 8192
      kimi:
        temperature: 0.4
        max_tokens: 8192
      mistral_small4:
        temperature: 0.3
        max_tokens: 4096
      minimax:
        temperature: 0.3
        max_tokens: 4096
      gpt54:
        temperature: 0.7
        max_tokens: 8192

# Bench config: GPT 5.4 as prose_stylist, Grok 4.20 as plot_architect,
# Haiku 4.5 as quality_polish. Used to evaluate the full pipeline vs the
# stripped pipeline (see --skip-gate-loop flag) with GPT prose.
agent_routing:
  prose_stylist:          { backend: cloud, model: gpt54, params: { temperature: 0.70, max_tokens: 8192 } }

  gate_critic:            { backend: cloud, model: haiku, params: { temperature: 0.3 } }
  chapter_gate_critic:    { backend: cloud, model: haiku, params: { temperature: 0.3 } }
  final_gate:             { backend: cloud, model: haiku, params: { temperature: 0.2 } }
  judge_evaluator:        { backend: cloud, model: grok420, params: { temperature: 0.2 } }
  manuscript_reviewer:    { backend: cloud, model: kimi, params: { temperature: 0.3 } }

  concept_workshop:       { backend: cloud, model: gemini, params: { temperature: 0.7, max_tokens: 8192 } }
  outline_planner:        { backend: cloud, model: gemini, params: { temperature: 0.5, max_tokens: 32768 } }
  seed_builder:           { backend: cloud, model: gemini, params: { temperature: 0.3, max_tokens: 16384 } }
  plot_architect:         { backend: cloud, model: grok420, params: { temperature: 0.4, max_tokens: 8192 } }
  chapter_blueprint_synthesizer: { backend: cloud, model: gemini, params: { temperature: 0.4, max_tokens: 8192 } }

  quality_polish:         { backend: cloud, model: haiku, params: { temperature: 0.4, max_tokens: 8192 } }

  voice_checker:          { backend: cloud, model: mistral_small4, params: { temperature: 0.3 } }
  stress_test:            { backend: cloud, model: deepseek, params: { temperature: 0.5 } }

  orchestrator:           { backend: cloud, model: grok41fast }
  canon_expert:           { backend: cloud, model: grok420, params: { temperature: 0.2 } }
  summarizer:             { backend: cloud, model: deepseek, params: { temperature: 0.2 } }
  character_specialist:   { backend: cloud, model: deepseek, params: { temperature: 0.3 } }
  lore_extractor:         { backend: cloud, model: deepseek, params: { temperature: 0.2, max_tokens: 8192 } }
  worldbuilding_coherence_reviewer: { backend: cloud, model: grok420, params: { temperature: 0.3 } }

pipeline:
  max_structural_retries: 3
  max_voice_retries: 2
  max_http_retries: 2
  embeddings:
    use_mock: true
    model: nomic-ai/nomic-embed-text-v1.5
  prompt_caching:
    enabled: true
    anthropic_ttl: 1h

worldbuilding:
  db_path: output/_fallback/worldbuilding.db
  vectors_dir: output/_fallback/worldbuilding_vectors
  default_top_k: 5
  walk_parents: true
  include_provisional_in_context: false
  auto_extraction:
    enabled: true
    auto_promote: false
  terminology:
    always_include: true
  reconciliation:
    run_on_startup: true
    interval_minutes: 60
