banned_phrases:
  faux_profundity:
    - "It wasn't just X, it was Y"
    - "A testament to"
    - "A tapestry of"
    - "A symphony of"
    - "It was more than"
  sensory_cliches:
    - "The smell of ozone"
    - "A shiver ran down"
    - "Eyes flashing with"
    - "Breath he didn't know he was holding"
    - "Jaw tightened"
  magic_adverbs:
    - "Quietly orchestrated"
    - "Fundamentally shifted"
    - "Remarkably"
    - "Seemingly"
  ai_tells:
    - "delve"
    - "tapestry"
    - "testament"
    - "nuanced"
    - "landscape"
    - "multifaceted"
    - "straightforward"
    - "it's important to note"
    - "it's worth noting"
  overwriting:
    - "With a fluid motion"
    - "Could not help but notice"
    - "Found himself"
    - "Found herself"
    - "Couldn't help but"
    - "In that moment"
    - "Something shifted within"
    - "The kind of pain that"
    - "The kind of silence that"
    - "The kind of weight that"
    - "Like a skip in a recording"
    - "Something about the way"
    - "There was something about"
  book_title_phrases:
    - "Bodies keep score"
    - "The body keeps the score"
    - "Quiet desperation"
    - "The road not taken"
    - "Sound and fury"
  force_over_explanation:
    - "Ambient hum of the"
    - "The Force's structural"
    - "A frequency that"
    - "The harmonic of the"

structural_rules:
  max_adverb_density: 0.02
  min_sentence_length_variance: 0.3
  max_same_opener_pct: 0.15
  metaphor_cooldown_paragraphs: 8
  max_description_introspection_pct: 0.55
  min_dialogue_ratio: 0.15
  max_metaphor_same_domain: 2
