deployment_mode: cloud  # local | cloud | hybrid

models:
  local:
    inference_backend: llama-server
    base_url: http://localhost:8080/v1
    timeout_seconds: 300
    models: {}
    default_params: {}

  cloud:
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 300
    models:
      deepseekpro: deepseek/deepseek-v4-pro
      gemini: google/gemini-3.1-pro-preview
      claude: anthropic/claude-sonnet-4.6
    default_params:
      deepseekpro:
        temperature: 0.3
        max_tokens: 8192
        reasoning:
          effort: "none"
      gemini:
        temperature: 0.6
        max_tokens: 8192
      claude:
        temperature: 0.4
        max_tokens: 8192

# Every studio call sends the whole book, so these models need ~1M-token
# context windows. studio_writer drafts, revises and polishes; studio_reader
# writes whole-book reader notes. To try another model, change `model` to
# another key under models.cloud.models (or add one there).
agent_routing:
  studio_writer:          { backend: cloud, model: deepseekpro, params: { temperature: 0.75, max_tokens: 16000, provider: { order: [deepseek], only: [deepseek], allow_fallbacks: false } } }
  studio_reader:          { backend: cloud, model: gemini, params: { temperature: 0.3, max_tokens: 8192 } }

pipeline:
  max_http_retries: 2
  prompt_caching:
    enabled: true  # Prompt caching for supported providers (reduces input costs)
    anthropic_ttl: 1h  # Anthropic cache TTL: "5m" (1.25x write) or "1h" (2x write)
