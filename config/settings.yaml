deployment_mode: hybrid  # each role below names its own backend

# Backends: where model calls go. Each needs only the API key named by
# api_key_env (put keys in .env, or enter them in the app's Settings). All
# but `anthropic` speak the OpenAI-compatible chat-completions API; that one
# uses the Anthropic SDK. The app lists each backend's `models` to choose from;
# a model's `efforts` are the reasoning efforts it accepts, which the app
# offers next to the chat box.
models:
  cloud:
    label: OpenRouter
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 300
    models:
      deepseekflash: { id: deepseek/deepseek-v4.1-flash-1017, label: DeepSeek V4.1 Flash 1017, efforts: [none, low, high, max] }
      geminiargon: { id: google/gemini-4-argon, label: Gemini 4 Argon, efforts: [low, medium, high] }
      deepseekpro: { id: deepseek/deepseek-v4-pro, label: DeepSeek V4 Pro }
      gemini: { id: google/gemini-3.1-pro-preview, label: Gemini 3.1 Pro }
      claude: { id: anthropic/claude-opus-5.5, label: Claude Opus 5.5 }
      claudesonnet: { id: anthropic/claude-sonnet-5.5, label: Claude Sonnet 5.5 }
      gpt: { id: openai/gpt-5.5, label: GPT-5.5 }
    default_params: {}

  anthropic:
    label: Anthropic
    api: anthropic
    api_key_env: ANTHROPIC_API_KEY
    timeout_seconds: 600
    models:
      opus: { id: claude-opus-5-5, label: Claude Opus 5.5 }
      sonnet: { id: claude-sonnet-5-5, label: Claude Sonnet 5.5 }
    default_params: {}

  openai:
    label: OpenAI
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout_seconds: 300
    models:
      gpt: { id: gpt-5.5, label: GPT-5.5 }
    default_params: {}

  google:
    label: Google
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    timeout_seconds: 300
    models:
      gemini: { id: gemini-3.1-pro-preview, label: Gemini 3.1 Pro }
    default_params: {}

  local:
    label: On this computer
    inference_backend: llama-server
    base_url: http://localhost:8080/v1
    timeout_seconds: 600
    models:
      local: { id: local-model, label: Local model }
    default_params: {}

# Every call sends the whole book, so these models need ~1M-token context
# windows. studio_chat is the room's conversation in the app (it edits the
# plan files, and can search the web and read pages through OpenRouter's
# server tools); studio_writer drafts and revises at maximum reasoning effort;
# studio_critic critiques each press draft (a different model catches
# different blind spots); studio_reader writes room reviews; studio_notes
# writes story-so-far notes. To try another model, change `model` to another
# key under models.cloud.models (or add one there). All request settings live
# here in `params`, so they follow the role, not the model. No role caps its
# output length (max_tokens), so each model can answer at full length; add one
# to `params` only if you need it. The DeepSeek roles pin OpenRouter to
# DeepSeek's own servers (`provider`) rather than reduced-precision hosts;
# remove that pin if you point a role at a different model. The Gemini roles
# set no temperature: the model reasons by default and is tuned at its own
# settings. The app's Settings page writes your choices to
# config/settings.local.yaml, which overrides these.
agent_routing:
  studio_chat:            { backend: cloud, model: deepseekflash, params: { provider: { order: [deepseek], only: [deepseek], allow_fallbacks: false }, tools: [{ type: "openrouter:web_search" }, { type: "openrouter:web_fetch", parameters: { max_content_tokens: 50000 } }] } }
  studio_writer:          { backend: cloud, model: deepseekflash, params: { temperature: 0.75, reasoning: { effort: "max" }, provider: { order: [deepseek], only: [deepseek], allow_fallbacks: false } } }
  studio_critic:          { backend: cloud, model: geminiargon, params: {} }
  studio_reader:          { backend: cloud, model: geminiargon, params: {} }
  studio_notes:           { backend: cloud, model: deepseekflash, params: { provider: { order: [deepseek], only: [deepseek], allow_fallbacks: false } } }

# The press (scripts/press.py build).
press:
  revision_rounds: 1            # critique-and-revise rounds per chapter; 0 = draft only
  default_chapter_words: 3000   # used when an outline section has no "Words: N" line
  length_calibration: 1.0       # multiplies the length asked for; raise it if chapters come in short
  min_revision_ratio: 0.6       # discard a revision shorter than this share of what it revised

pipeline:
  max_http_retries: 2
  prompt_caching:
    enabled: true  # Prompt caching for supported providers (reduces input costs)
    anthropic_ttl: 1h  # Anthropic cache TTL: "5m" (1.25x write) or "1h" (2x write)
