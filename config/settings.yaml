deployment_mode: cloud  # local | cloud | hybrid

models:
  local:
    inference_backend: llama-server
    base_url: http://localhost:8080/v1
    models: {}
    default_params: {}

  cloud:
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    models:
      # Gemini 3.1 Pro — workshop, prose, and quality-sensitive agents
      primary: google/gemini-3.1-pro-preview
      # DeepSeek V3.2 — bulk pipeline agents (cheap)
      budget: deepseek/deepseek-v3.2
      # Claude Sonnet 4 — high-stakes evaluation
      premium: anthropic/claude-sonnet-4-20250514
    default_params:
      primary:
        temperature: 0.7
        max_tokens: 8192
      budget:
        temperature: 0.4
        max_tokens: 4096
      premium:
        temperature: 0.3
        max_tokens: 4096

# Agent-to-model mapping
# NOTE: The 'backend' field is ONLY honoured in 'hybrid' deployment_mode.
# In 'local' or 'cloud' mode, ALL agents use the deployment_mode backend.
agent_routing:
  # --- Workshop: Gemini 3.1 Pro (franchise knowledge + reasoning) ---
  concept_workshop:       { backend: cloud, model: primary, params: { temperature: 0.7, max_tokens: 8192 } }

  # --- Prose generation: Gemini 3.1 Pro (quality-visible, writes the novel) ---
  prose_stylist:          { backend: cloud, model: primary, params: { temperature: 0.9 } }

  # --- Pipeline agents: DeepSeek V3.2 (structured tasks, cheap) ---
  orchestrator:           { backend: cloud, model: budget }
  plot_architect:         { backend: cloud, model: budget, params: { temperature: 0.4 } }
  gate_critic:            { backend: cloud, model: budget, params: { temperature: 0.3 } }
  craft_editor:           { backend: cloud, model: budget, params: { temperature: 0.4 } }
  canon_expert:           { backend: cloud, model: budget }
  summarizer:             { backend: cloud, model: budget, params: { temperature: 0.2 } }
  character_specialist:   { backend: cloud, model: budget, params: { temperature: 0.4 } }
  lore_extractor:         { backend: cloud, model: budget, params: { temperature: 0.2 } }

  # --- Phase 3: Revision pipeline (DeepSeek V3.2) ---
  structural_continuity_reviewer: { backend: cloud, model: budget, params: { temperature: 0.3 } }
  scene_emotion_reviewer:         { backend: cloud, model: budget, params: { temperature: 0.5 } }
  line_copy_editor:               { backend: cloud, model: budget, params: { temperature: 0.3 } }

  # --- Phase 4: Planning & polish (DeepSeek V3.2) ---
  outline_planner:                 { backend: cloud, model: budget, params: { temperature: 0.5 } }
  dialogue_polish_editor:          { backend: cloud, model: budget, params: { temperature: 0.4 } }
  worldbuilding_coherence_reviewer: { backend: cloud, model: budget, params: { temperature: 0.3 } }

  # --- Quality-sensitive: Gemini 3.1 Pro (needs better judgment) ---
  voice_checker:          { backend: cloud, model: primary, params: { temperature: 0.3 } }
  stress_test:            { backend: cloud, model: primary, params: { temperature: 0.5 } }

  # --- Evaluation: Claude Sonnet 4 (high-stakes judgment) ---
  judge_evaluator:        { backend: cloud, model: premium, params: { temperature: 0.2 } }
  manuscript_reviewer:    { backend: cloud, model: premium, params: { temperature: 0.3 } }

# Pipeline settings
pipeline:
  max_structural_retries: 3
  max_voice_retries: 2
  chapter_output_dir: data/manuscripts
  run_ledger_path: data/run_ledger.db

# Worldbuilding persistence
worldbuilding:
  db_path: data/worldbuilding.db
  vectors_dir: data/worldbuilding_vectors
  default_top_k: 5
  walk_parents: true
  include_provisional_in_context: false
  auto_extraction:
    enabled: true
    auto_promote: false
  terminology:
    always_include: true
  reconciliation:
    run_on_startup: true
    interval_minutes: 60
