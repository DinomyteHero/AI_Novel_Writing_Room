deployment_mode: hybrid  # each role below names its own backend

# Backends: where model calls go. Each needs only the API key named by
# api_key_env (put keys in .env, or enter them in the app's Settings). All
# but `anthropic` speak the OpenAI-compatible chat-completions API; that one
# uses the Anthropic SDK. The app lists each backend's `models` to choose from;
# a model's `efforts` are the reasoning efforts it accepts, which the app
# offers next to the chat box. For OpenRouter (`cloud`), the app also offers
# the newest models of the main makers from OpenRouter's public catalog, with
# prices, refreshed at most daily into config/openrouter_models.json; the
# models listed here come first and are the only automatic choices.
models:
  cloud:
    label: OpenRouter
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 300
    # The top of the chat's model picker, in this order. Names from the list below.
    suggested:
      - google/gemini-3.8-flash
      - z-ai/glm-5.3-flash
      - ~deepseek/deepseek-flash-latest
      - xiaomi/mimo-v2.6-pro
      - terra
      - aionmini
      - minimax
      - qwen/qwen3.8-flash
    models:
      deepseekflash: { id: deepseek/deepseek-v4.1-flash-1017, label: DeepSeek V4.1 Flash 1017, efforts: [none, low, high, max] }
      geminiargon: { id: google/gemini-4-argon, label: Gemini 4 Argon, efforts: [low, medium, high] }
      claude: { id: anthropic/claude-opus-5.5, label: Claude Opus 5.5 }
      claudesonnet: { id: anthropic/claude-sonnet-5.5, label: Claude Sonnet 5.5 }
      terra: { id: openai/gpt-6.1-terra, label: GPT-6.1 Terra }
      haiku: { id: anthropic/claude-haiku-5.5, label: Claude Haiku 5.5 }
      glm: { id: z-ai/glm-5.3, label: GLM 5.3, context: 1000000, efforts: [max] }
      minimax: { id: minimax/minimax-m3.1-flash, label: MiniMax M3.1 Flash }
      # Older models stay available to chats that already chose them, but are
      # hidden from the model lists.
      deepseekpro: { id: deepseek/deepseek-v4-pro, label: DeepSeek V4 Pro, hidden: true }
      gemini: { id: google/gemini-3.1-pro-preview, label: Gemini 3.1 Pro, hidden: true }
      gpt: { id: openai/gpt-5.5, label: GPT-5.5, hidden: true }
      # AionLabs' storytelling systems: several models behind one endpoint,
      # tuned to keep tension up. Their 262K-token window holds one book of
      # up to about 150K words, not a whole series, so try them as the writer
      # on a standalone book.
      aion: { id: aion-labs/aion-3.5, label: Aion 3.5, context: 262000 }
      aionmini: { id: aion-labs/aion-3.5-mini, label: Aion 3.5 Mini, context: 262000 }
      # Suggested models the catalog might otherwise hide or never offer. They keep
      # their OpenRouter ids as names, so chats that already chose them still match.
      google/gemini-3.8-flash: { id: google/gemini-3.8-flash, label: Gemini 3.8 Flash }
      z-ai/glm-5.3-flash: { id: z-ai/glm-5.3-flash, label: GLM 5.3 Flash }
      ~deepseek/deepseek-flash-latest: { id: ~deepseek/deepseek-flash-latest, label: DeepSeek Flash Latest }
      xiaomi/mimo-v2.6-pro: { id: xiaomi/mimo-v2.6-pro, label: MiMo V2.6 Pro }
      qwen/qwen3.8-flash: { id: qwen/qwen3.8-flash, label: Qwen3.8 Flash }
    default_params: {}

  anthropic:
    label: Anthropic
    api: anthropic
    api_key_env: ANTHROPIC_API_KEY
    timeout_seconds: 600
    models:
      opus: { id: claude-opus-5-5, label: Claude Opus 5.5 }
      sonnet: { id: claude-sonnet-5-5, label: Claude Sonnet 5.5 }
    default_params: {}

  openai:
    label: OpenAI
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout_seconds: 300
    suggested: [terra]
    models:
      terra: { id: gpt-6.1-terra, label: GPT-6.1 Terra }
      gpt: { id: gpt-5.5, label: GPT-5.5, hidden: true }
    default_params: {}

  google:
    label: Google
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    timeout_seconds: 300
    models:
      argon: { id: gemini-4-argon, label: Gemini 4 Argon }
      gemini: { id: gemini-3.1-pro-preview, label: Gemini 3.1 Pro, hidden: true }
    default_params: {}

  local:
    label: On this computer
    inference_backend: llama-server
    base_url: http://localhost:8080/v1
    timeout_seconds: 600
    models:
      local: { id: local-model, label: Local model }
    default_params: {}

# Every call sends the whole book, so these models need ~1M-token context
# windows. studio_chat is the room's conversation in the app (it edits the
# plan files, and can search the web and read pages through OpenRouter's
# server tools); studio_writer drafts and revises at high reasoning effort;
# studio_critic critiques each press draft (Claude Sonnet 5.5: a different
# model from the Gemini writer, and strong enough to read every chapter);
# studio_reader writes room reviews and ideas (also Sonnet 5.5, so a
# different family from the writer reads the book); studio_notes writes
# story-so-far notes. To try another model, change `model`
# to another key under models.cloud.models (or add one there). All request
# settings live here in `params`, so they follow the role, not the model. No
# role caps its output length (max_tokens), so each model can answer at full
# length; add one to `params` only if you need it. The DeepSeek role pins
# OpenRouter to DeepSeek's own servers (`provider`) rather than reduced-precision
# hosts; remove that pin if you point a role at a different model. The Gemini
# roles set no temperature: the model reasons by default and is tuned at its
# own settings. The app's Settings page writes your choices to
# config/settings.local.yaml, which overrides these.
agent_routing:
  studio_chat:            { backend: cloud, model: geminiargon, params: { tools: [{ type: "openrouter:web_search" }, { type: "openrouter:web_fetch", parameters: { max_content_tokens: 50000 } }] } }
  # Gemini is the value default for drafting; for the strongest prose on a
  # standalone book, switch studio_writer to cloud/claude (Opus 5.5) with
  # reasoning effort high. It costs more per call but reads the same 1M window.
  studio_writer:          { backend: cloud, model: geminiargon, params: { reasoning: { effort: "high" } } }
  studio_critic:          { backend: cloud, model: claudesonnet, params: {} }
  studio_reader:          { backend: cloud, model: claudesonnet, params: {} }
  studio_notes:           { backend: cloud, model: deepseekflash, params: { provider: { order: [deepseek], only: [deepseek], allow_fallbacks: false } } }

# The press (scripts/press.py build).
press:
  revision_rounds: 1            # critique-and-revise rounds per chapter; 0 = draft only
  default_chapter_words: 3000   # used when an outline section has no "Words: N" line
  length_calibration: 1.0       # multiplies the length asked for; raise it if chapters come in short, lower it if long
  min_revision_ratio: 0.6       # discard a revision shorter than this share of what it revised or the plan, whichever is smaller

pipeline:
  max_http_retries: 2
  prompt_caching:
    enabled: true  # Prompt caching for supported providers (reduces input costs)
    anthropic_ttl: 1h  # Anthropic cache TTL: "5m" (1.25x write) or "1h" (2x write)
