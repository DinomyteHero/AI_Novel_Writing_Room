deployment_mode: cloud  # local | cloud | hybrid

models:
  local:
    inference_backend: llama-server
    base_url: http://localhost:8080/v1
    timeout_seconds: 300
    models: {}
    default_params: {}

  cloud:
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 300
    models:
      gemini: google/gemini-3.1-pro-preview
      gemini_flash: google/gemini-3-flash-preview
      deepseek: deepseek/deepseek-v3.2
      claude: anthropic/claude-sonnet-4.6
      haiku: anthropic/claude-haiku-4.5
      # --- Additional models ---
      glm: z-ai/glm-5.1
      qwen: qwen/qwen3.6-plus
      kimi: moonshotai/kimi-k2.5
      grok420: x-ai/grok-4.20
      grok41fast: x-ai/grok-4.1-fast
      mistral_small4: mistralai/mistral-small-2603
      minimax: minimax/minimax-m2.7
      # Relay Stage 3a — GPT 5.4 for line-editing (prose rhythm, imagery,
      # voice texture) after the Claude Sonnet 4.6 drafter. Mirrors the
      # bench config entry so agent routing can reference `gpt54`.
      gpt54: openai/gpt-5.4
      # GPT 5.4-mini — cheaper tier of the same family. Rubric 82.55 on
      # EQBench Creative Writing v3 (within 2pts of full gpt-5.4). Used
      # for quality_polish so the polisher matches the line-editor's family.
      gpt54_mini: openai/gpt-5.4-mini
    default_params:
      gemini:
        temperature: 0.6
        max_tokens: 8192
      gemini_flash:
        temperature: 0.5
        max_tokens: 8192
      deepseek:
        temperature: 0.3
        max_tokens: 4096
      claude:
        temperature: 0.4
        max_tokens: 8192
      haiku:
        temperature: 0.4
        max_tokens: 4096
      glm:
        temperature: 0.4
        max_tokens: 8192
      grok420:
        temperature: 0.3
        max_tokens: 8192
      grok41fast:
        temperature: 0.3
        max_tokens: 8192
      kimi:
        temperature: 0.4
        max_tokens: 8192
      mistral_small4:
        temperature: 0.3
        max_tokens: 4096
      minimax:
        temperature: 0.3
        max_tokens: 4096
      gpt54:
        temperature: 0.8
        max_tokens: 12000
      gpt54_mini:
        temperature: 0.5
        max_tokens: 8192

# Agent-to-model mapping
# NOTE: The 'backend' field is ONLY honoured in 'hybrid' deployment_mode.
# In 'local' or 'cloud' mode, ALL agents use the deployment_mode backend.
agent_routing:
  # PROSE — Sonnet with softened constraints (untested combo): Sonnet's obedience + room to breathe. Plot architect on Gemini Pro.
  prose_stylist:          { backend: cloud, model: claude, params: { temperature: 0.80, max_tokens: 8192 } }

  # Relay Stage 3 — GPT 5.4 line-editing pass after the drafter. Preserves
  # beat sequence, turning point, POV, characters_present, and canonical
  # facts; rewrites at sentence level for rhythm, imagery, and voice texture.
  line_writer:            { backend: cloud, model: gpt54, params: { temperature: 0.8, max_tokens: 12000 } }

  # GATE/EVAL — Haiku for gate + final gate (precise, cheap), Grok 4.20 for judge (Arena CW #4, understands prose quality), Kimi K2.5 for manuscript review
  gate_critic:            { backend: cloud, model: haiku, params: { temperature: 0.3 } }
  chapter_gate_critic:    { backend: cloud, model: haiku, params: { temperature: 0.3 } }
  final_gate:             { backend: cloud, model: haiku, params: { temperature: 0.2 } }
  judge_evaluator:        { backend: cloud, model: grok420, params: { temperature: 0.2 } }
  manuscript_reviewer:    { backend: cloud, model: kimi, params: { temperature: 0.3 } }
  # Relay Stage 1g — binary check for characters who speak/act while absent from characters_present.
  presence_checker:       { backend: cloud, model: haiku, params: { temperature: 0.1, max_tokens: 1000 } }
  # Architecture upgrade Slice 4 — narrow post-save continuity event extraction
  # from saved prose. Haiku at t=0.0 for determinism and cost. max_tokens=2048
  # is well more than enough for the 5-type narrow schema.
  continuity_extractor:   { backend: cloud, model: haiku, params: { temperature: 0.0, max_tokens: 2048 } }

  # PLANNING — Gemini Pro for long-context one-off authoring; Haiku 4.5 for
  # the per-scene plot_architect (structured JSON output at ~1/6 the cost).
  concept_workshop:       { backend: cloud, model: gemini, params: { temperature: 0.7, max_tokens: 8192 } }
  outline_planner:        { backend: cloud, model: gemini, params: { temperature: 0.5, max_tokens: 32768 } }
  seed_builder:           { backend: cloud, model: gemini, params: { temperature: 0.3, max_tokens: 16384 } }
  plot_architect:         { backend: cloud, model: haiku, params: { temperature: 0.4, max_tokens: 4096 } }
  chapter_blueprint_synthesizer: { backend: cloud, model: gemini, params: { temperature: 0.4, max_tokens: 8192 } }

  # POLISH — GPT 5.4-mini matches the line_writer's family (gpt-5.4)
  # for style consistency across the post-draft chain. Rubric 82.55 on
  # EQBench Creative Writing v3.
  quality_polish:         { backend: cloud, model: gpt54_mini, params: { temperature: 0.5, max_tokens: 8192 } }

  # EDITORIAL — plan-time qualitative review (Hat 1: Brooks/Weiland structural; Hat 2: genre-reader). One call per compile; advisory output.
  editorial_consultant:   { backend: cloud, model: claude, params: { temperature: 0.4, max_tokens: 16384 } }

  # STRUCTURAL REVISION — Mistral Small 4 for voice check, DeepSeek for stress test
  voice_checker:          { backend: cloud, model: mistral_small4, params: { temperature: 0.3 } }
  stress_test:            { backend: cloud, model: deepseek, params: { temperature: 0.5 } }

  # UTILITY — Grok 4.1 Fast for orchestration, DeepSeek for analytics,
  # Grok 4.20 for canon_expert (franchise knowledge; revisit after baseline).
  orchestrator:           { backend: cloud, model: grok41fast }
  canon_expert:           { backend: cloud, model: grok420, params: { temperature: 0.2 } }
  summarizer:             { backend: cloud, model: deepseek, params: { temperature: 0.2 } }
  character_specialist:   { backend: cloud, model: deepseek, params: { temperature: 0.3 } }
  lore_extractor:         { backend: cloud, model: deepseek, params: { temperature: 0.2, max_tokens: 8192 } }
  worldbuilding_coherence_reviewer: { backend: cloud, model: grok420, params: { temperature: 0.3 } }

# Pipeline settings
pipeline:
  # Relay refactor (Stage 1e): retries zeroed. Orchestrator is forward-only.
  # Keys retained as a rollback valve — raise to re-enable gate-driven rewrites.
  max_structural_retries: 0
  max_voice_retries: 0
  max_http_retries: 2
  embeddings:
    use_mock: true  # Set to false for real semantic similarity (requires sentence-transformers)
    model: nomic-ai/nomic-embed-text-v1.5
  prompt_caching:
    enabled: true  # Enable prompt caching for supported providers (reduces input costs)
    anthropic_ttl: 1h  # Cache TTL for Anthropic models: "5m" (1.25x write) or "1h" (2x write, better for sequential pipelines)

# Worldbuilding persistence
# Live runs override these paths via ProjectPaths (franchise-scoped).
# The values below are fallback defaults for ad-hoc invocations without
# a concept-seed context — they write to gitignored output/_fallback/.
worldbuilding:
  db_path: output/_fallback/worldbuilding.db
  vectors_dir: output/_fallback/worldbuilding_vectors
  default_top_k: 5
  walk_parents: true
  include_provisional_in_context: false
  auto_extraction:
    enabled: true
    auto_promote: false
  terminology:
    always_include: true
  reconciliation:
    run_on_startup: true
    interval_minutes: 60

# Architecture upgrade runtime flags.
# Every flag defaults to the SAFEST value (off, or most conservative numeric).
# Slice 1 adds phase0_audit + firewall + successor_classifier.
# Later slices (2-5) add chapter_packet, revision_debt, canon_expert.early_position,
# promise_ledger, continuity_log, sociogram. See docs/architecture/architecture_upgrade_spec.md.
# Per-book overrides at data/franchises/<franchise>/books/<book>/runtime_overrides.yaml.
runtime:
  phase0_audit:
    enabled: false
  firewall:
    enabled: false
    successor_classifier:
      enabled: false
      jaccard_threshold: 0.5
      adjacency_max_for_continue: 1
  chapter_packet:
    enabled: false
    fallback_on_error: true
  revision_debt:
    enabled: false
  canon_expert:
    early_position: false
    apply_local_fixes: false
    local_fixes_whitelist: []
  promise_ledger:
    enabled: false
  continuity_log:
    enabled: false
    min_confidence: 0.85
  sociogram:
    enabled: false
    suggest_mode: false