deployment_mode: cloud  # local | cloud | hybrid

models:
  local:
    inference_backend: llama-server
    base_url: http://localhost:8080/v1
    timeout_seconds: 300
    models: {}
    default_params: {}

  cloud:
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 300
    models:
      gemini: google/gemini-3.1-pro-preview
      gemini_flash: google/gemini-3-flash-preview
      deepseek: deepseek/deepseek-v3.2
      claude: anthropic/claude-sonnet-4.6
      haiku: anthropic/claude-haiku-4.5
      # --- Test alternatives for prose_stylist ---
      glm: z-ai/glm-5.1
      qwen: qwen/qwen3.6-plus
      kimi: moonshotai/kimi-k2
    default_params:
      gemini:
        temperature: 0.6
        max_tokens: 8192
      gemini_flash:
        temperature: 0.5
        max_tokens: 8192
      deepseek:
        temperature: 0.3
        max_tokens: 4096
      claude:
        temperature: 0.4
        max_tokens: 8192
      haiku:
        temperature: 0.4
        max_tokens: 4096

# Agent-to-model mapping
# NOTE: The 'backend' field is ONLY honoured in 'hybrid' deployment_mode.
# In 'local' or 'cloud' mode, ALL agents use the deployment_mode backend.
agent_routing:

  # =========================================================================
  # PROSE GENERATION — Claude Sonnet 4
  # Highest-impact slot. The agent the reader actually sees.
  # To test alternatives, swap 'claude' for 'kimi', 'glm', 'qwen', or 'gemini'
  # =========================================================================
  prose_stylist:          { backend: cloud, model: claude, params: { temperature: 0.85, max_tokens: 8192 } }

  # =========================================================================
  # GATE CRITIC — Claude Sonnet 4
  # Single chokepoint deciding pass/fail on scenes. Needs the best judgment
  # available. Cross-model check: Claude judging Claude-written prose.
  # =========================================================================
  gate_critic:            { backend: cloud, model: claude, params: { temperature: 0.3 } }

  # =========================================================================
  # EVALUATION — Claude Sonnet 4
  # High-stakes final judgment. Runs infrequently, quality justifies cost.
  # =========================================================================
  judge_evaluator:        { backend: cloud, model: claude, params: { temperature: 0.2 } }
  manuscript_reviewer:    { backend: cloud, model: claude, params: { temperature: 0.3 } }

  # =========================================================================
  # WORKSHOP & PLANNING — Gemini 3.1 Pro
  # Deep reasoning, franchise knowledge, long creative sessions.
  # These run infrequently — Pro-tier cost is justified.
  # =========================================================================
  concept_workshop:       { backend: cloud, model: gemini, params: { temperature: 0.7, max_tokens: 8192 } }
  outline_planner:        { backend: cloud, model: gemini, params: { temperature: 0.5, max_tokens: 32768 } }
  seed_builder:           { backend: cloud, model: gemini, params: { temperature: 0.3, max_tokens: 16384 } }

  # =========================================================================
  # PROSE-SENSITIVE REVISION — Claude Haiku 4.5
  # Agents that need to hear voice drift, cadence issues, and emotional
  # flatness. Same model family as the prose_stylist — shares Claude's
  # prose instincts at 1/3 the cost of Sonnet.
  # =========================================================================
  craft_editor:           { backend: cloud, model: haiku, params: { temperature: 0.4 } }
  scene_emotion_reviewer: { backend: cloud, model: haiku, params: { temperature: 0.5 } }
  dialogue_polish_editor: { backend: cloud, model: haiku, params: { temperature: 0.4 } }

  # =========================================================================
  # STRUCTURAL REVISION — Gemini 3 Flash
  # Mechanical/structural checks where speed and cost matter more than
  # prose sensitivity. Near-Pro quality at 1/4 the cost.
  # =========================================================================
  line_copy_editor:       { backend: cloud, model: gemini_flash, params: { temperature: 0.3 } }
  voice_checker:          { backend: cloud, model: gemini_flash, params: { temperature: 0.3 } }
  stress_test:            { backend: cloud, model: gemini_flash, params: { temperature: 0.5 } }

  # =========================================================================
  # PIPELINE UTILITY — Gemini 3 Flash
  # Structured tasks, pattern-matching, extraction. Fast iteration.
  # To test MiniMax M2.7 as cheaper/faster alternative, swap to 'minimax'
  # To revert to cost-optimized production, swap to 'deepseek'
  # =========================================================================
  orchestrator:           { backend: cloud, model: gemini_flash }
  plot_architect:         { backend: cloud, model: gemini_flash, params: { temperature: 0.4 } }
  canon_expert:           { backend: cloud, model: gemini_flash, params: { temperature: 0.2 } }
  summarizer:             { backend: cloud, model: gemini_flash, params: { temperature: 0.2 } }
  character_specialist:   { backend: cloud, model: gemini_flash, params: { temperature: 0.4 } }
  lore_extractor:         { backend: cloud, model: gemini_flash, params: { temperature: 0.2 } }
  structural_continuity_reviewer: { backend: cloud, model: gemini_flash, params: { temperature: 0.3 } }
  worldbuilding_coherence_reviewer: { backend: cloud, model: gemini_flash, params: { temperature: 0.3 } }

# Pipeline settings
pipeline:
  max_structural_retries: 3
  max_voice_retries: 2
  max_http_retries: 2
  embeddings:
    use_mock: true  # Set to false for real semantic similarity (requires sentence-transformers)
    model: nomic-ai/nomic-embed-text-v1.5

# Worldbuilding persistence
worldbuilding:
  db_path: data/worldbuilding.db
  vectors_dir: data/worldbuilding_vectors
  default_top_k: 5
  walk_parents: true
  include_provisional_in_context: false
  auto_extraction:
    enabled: true
    auto_promote: false
  terminology:
    always_include: true
  reconciliation:
    run_on_startup: true
    interval_minutes: 60