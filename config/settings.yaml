deployment_mode: cloud  # local | cloud | hybrid

models:
  local:
    inference_backend: llama-server
    base_url: http://localhost:8080/v1
    timeout_seconds: 300
    models: {}
    default_params: {}

  cloud:
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 300
    models:
      gemini: google/gemini-3.1-pro-preview
      gemini_flash: google/gemini-3-flash-preview
      deepseek: deepseek/deepseek-v3.2
      claude: anthropic/claude-sonnet-4.6
      haiku: anthropic/claude-haiku-4.5
      # --- Additional models ---
      glm: z-ai/glm-5.1
      qwen: qwen/qwen3.6-plus
      kimi: moonshotai/kimi-k2
      grok420: x-ai/grok-4.20
      grok41fast: x-ai/grok-4.1-fast
      mistral_small4: mistralai/mistral-small-2603
      minimax: minimax/minimax-m2.7
    default_params:
      gemini:
        temperature: 0.6
        max_tokens: 8192
      gemini_flash:
        temperature: 0.5
        max_tokens: 8192
      deepseek:
        temperature: 0.3
        max_tokens: 4096
      claude:
        temperature: 0.4
        max_tokens: 8192
      haiku:
        temperature: 0.4
        max_tokens: 4096
      glm:
        temperature: 0.4
        max_tokens: 8192
      grok420:
        temperature: 0.3
        max_tokens: 8192
      grok41fast:
        temperature: 0.3
        max_tokens: 8192
      kimi:
        temperature: 0.4
        max_tokens: 8192
      mistral_small4:
        temperature: 0.3
        max_tokens: 4096
      minimax:
        temperature: 0.3
        max_tokens: 4096

# Agent-to-model mapping
# NOTE: The 'backend' field is ONLY honoured in 'hybrid' deployment_mode.
# In 'local' or 'cloud' mode, ALL agents use the deployment_mode backend.
agent_routing:
  # PROSE — Sonnet with softened constraints (untested combo): Sonnet's obedience + room to breathe. Plot architect on Gemini Pro.
  prose_stylist:          { backend: cloud, model: claude, params: { temperature: 0.80, max_tokens: 8192 } }

  # GATE/EVAL — Haiku for gate (precise, cheap), Grok 4.20 for judge (Arena CW #4, understands prose quality), Kimi K2 for manuscript review
  gate_critic:            { backend: cloud, model: haiku, params: { temperature: 0.3 } }
  judge_evaluator:        { backend: cloud, model: grok420, params: { temperature: 0.2 } }
  manuscript_reviewer:    { backend: cloud, model: kimi, params: { temperature: 0.3 } }

  # PLANNING — Gemini Pro across all planning agents (testing if Pro architect restores tonal palette vs Flash)
  concept_workshop:       { backend: cloud, model: gemini, params: { temperature: 0.7, max_tokens: 8192 } }
  outline_planner:        { backend: cloud, model: gemini, params: { temperature: 0.5, max_tokens: 32768 } }
  seed_builder:           { backend: cloud, model: gemini, params: { temperature: 0.3, max_tokens: 16384 } }
  plot_architect:         { backend: cloud, model: gemini, params: { temperature: 0.4 } }

  # PROSE-SENSITIVE REVISION — Kimi K2 for craft/emotion (cheaper than Haiku, better CW: EQ-Bench #9), Kimi K2 for dialogue polish
  craft_editor:           { backend: cloud, model: kimi, params: { temperature: 0.4, max_tokens: 8192 } }
  scene_emotion_reviewer: { backend: cloud, model: kimi, params: { temperature: 0.5 } }
  dialogue_polish_editor: { backend: cloud, model: kimi, params: { temperature: 0.4 } }

  # STRUCTURAL REVISION — Mistral Small 4 for copy/voice (pattern-matching, $0.15/$0.60), DeepSeek for stress test
  line_copy_editor:       { backend: cloud, model: mistral_small4, params: { temperature: 0.3 } }
  voice_checker:          { backend: cloud, model: mistral_small4, params: { temperature: 0.3 } }
  stress_test:            { backend: cloud, model: deepseek, params: { temperature: 0.5 } }

  # UTILITY — Grok 4.1 Fast for orchestration, DeepSeek for analytics, Grok 4.20 for franchise knowledge
  orchestrator:           { backend: cloud, model: grok41fast }
  canon_expert:           { backend: cloud, model: grok420, params: { temperature: 0.2 } }
  summarizer:             { backend: cloud, model: deepseek, params: { temperature: 0.2 } }
  character_specialist:   { backend: cloud, model: deepseek, params: { temperature: 0.3 } }
  lore_extractor:         { backend: cloud, model: deepseek, params: { temperature: 0.2, max_tokens: 8192 } }
  structural_continuity_reviewer: { backend: cloud, model: deepseek, params: { temperature: 0.3 } }
  worldbuilding_coherence_reviewer: { backend: cloud, model: grok420, params: { temperature: 0.3 } }

# Pipeline settings
pipeline:
  max_structural_retries: 3
  max_voice_retries: 2
  max_http_retries: 2
  embeddings:
    use_mock: true  # Set to false for real semantic similarity (requires sentence-transformers)
    model: nomic-ai/nomic-embed-text-v1.5
  prompt_caching:
    enabled: true  # Enable prompt caching for supported providers (reduces input costs)
    anthropic_ttl: 1h  # Cache TTL for Anthropic models: "5m" (1.25x write) or "1h" (2x write, better for sequential pipelines)

# Worldbuilding persistence
worldbuilding:
  db_path: data/worldbuilding.db
  vectors_dir: data/worldbuilding_vectors
  default_top_k: 5
  walk_parents: true
  include_provisional_in_context: false
  auto_extraction:
    enabled: true
    auto_promote: false
  terminology:
    always_include: true
  reconciliation:
    run_on_startup: true
    interval_minutes: 60